<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#c0c0c0" stroke="#808080" stroke-width="4"/>
  <!-- 16x16 pixel art grid -->
  <g transform="translate(50, 50) scale(6)">
    <!-- background -->
    <rect x="0" y="0" width="16" height="16" fill="#ff9e44"/>
    <!-- simple pixel art tree -->
    <rect x="7" y="8" width="2" height="6" fill="#8B4513"/>
    <rect x="5" y="6" width="6" height="2" fill="#228B22"/>
    <rect x="6" y="4" width="4" height="2" fill="#228B22"/>
    <rect x="7" y="2" width="2" height="2" fill="#228B22"/>
  </g>
  <text x="100" y="170" font-family="'MS Sans Serif', Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Pixel Art #2</text>
</svg> 