<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#c0c0c0" stroke="#808080" stroke-width="4"/>
  
  <!-- Floppy Disk -->
  <g transform="translate(50, 50)">
    <!-- Main body -->
    <rect x="0" y="0" width="100" height="100" rx="3" ry="3" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    
    <!-- Metal slider -->
    <rect x="10" y="0" width="80" height="15" fill="#c0c0c0" stroke="#777" stroke-width="1"/>
    
    <!-- Label area -->
    <rect x="10" y="25" width="80" height="60" fill="#f0f0f0" stroke="#aaa" stroke-width="1"/>
    
    <!-- Write protect notch -->
    <rect x="0" y="75" width="10" height="15" fill="#3a3a3a" stroke="none"/>
    
    <!-- Center hub hole -->
    <circle cx="50" cy="55" r="8" fill="#1a1a1a" stroke="#aaa" stroke-width="1"/>
    <circle cx="50" cy="55" r="2" fill="#aaa" stroke="none"/>
    
    <!-- Label text -->
    <text x="50" y="45" font-family="Arial" font-size="8" text-anchor="middle" fill="#333">MS-DOS</text>
    <text x="50" y="60" font-family="Arial" font-size="6" text-anchor="middle" fill="#333">1.44 MB</text>
  </g>
  
  <text x="100" y="170" font-family="'MS Sans Serif', Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Floppy Disk #1</text>
</svg> 