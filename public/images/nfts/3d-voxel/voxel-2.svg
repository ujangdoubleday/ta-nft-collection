<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#c0c0c0" stroke="#808080" stroke-width="4"/>
  <!-- Voxel castle -->
  <g transform="translate(50, 50)">
    <!-- Base -->
    <polygon points="50,0 100,25 50,50 0,25" fill="#8596dd" stroke="#333" stroke-width="1"/>
    
    <!-- Tower 1 (left) -->
    <polygon points="25,12.5 25,62.5 0,50 0,0" fill="#6e7fc7" stroke="#333" stroke-width="1"/>
    <polygon points="50,25 50,75 25,62.5 25,12.5" fill="#5d6eb6" stroke="#333" stroke-width="1"/>
    
    <!-- Tower 2 (right) -->
    <polygon points="75,12.5 75,62.5 50,75 50,25" fill="#5d6eb6" stroke="#333" stroke-width="1"/>
    <polygon points="100,0 100,50 75,62.5 75,12.5" fill="#6e7fc7" stroke="#333" stroke-width="1"/>
  </g>
  <text x="100" y="170" font-family="'MS Sans Serif', Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Voxel Art #2</text>
</svg> 