<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#c0c0c0" stroke="#808080" stroke-width="4"/>
  <!-- Simple 3D cube using SVG -->
  <g transform="translate(60, 50)">
    <!-- Top face -->
    <polygon points="40,0 80,20 40,40 0,20" fill="#5d5d5d" stroke="#333" stroke-width="1"/>
    <!-- Right face -->
    <polygon points="80,20 80,60 40,80 40,40" fill="#444" stroke="#333" stroke-width="1"/>
    <!-- Front face -->
    <polygon points="40,40 40,80 0,60 0,20" fill="#777" stroke="#333" stroke-width="1"/>
  </g>
  <text x="100" y="170" font-family="'MS Sans Serif', Arial, sans-serif" font-size="14" text-anchor="middle" fill="black">Voxel Art #1</text>
</svg> 